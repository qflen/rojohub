[workspace]
members = ["launcher"]

[package]
name = "rojohub"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "One local hub for many Rojo projects and Roblox Studio windows"
repository = "https://github.com/qflen/rojohub"
publish = false

[[bin]]
name = "rojohub"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rmp-serde = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rand = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
